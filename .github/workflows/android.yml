# Builds the Android app (APK) and publishes it as the "android" release, so the website's
# "Download the app" button always gives the newest version.
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ZH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ZH_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the web files (offline fallback inside the app)
        run: npm run build
      - run: npx cap sync android

      - name: Firebase config (for notifications)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase: on"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — the app builds, but closed-app notifications won't work."
          fi

      - name: Signing key
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ZH_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zweiherzen.jks"
            echo "ZH_KEYSTORE_PATH=$RUNNER_TEMP/zweiherzen.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets not set — building a test (debug) APK that can't be published."
          fi

      - name: Build APK
        working-directory: android
        run: |
          if [ "$SIGNED" = "1" ]; then ./gradlew --no-daemon assembleRelease; cp app/build/outputs/apk/release/app-release.apk ../zwei-herzen.apk
          else ./gradlew --no-daemon assembleDebug; cp app/build/outputs/apk/debug/app-debug.apk ../zwei-herzen.apk; fi
          ls -la ../zwei-herzen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zwei-herzen-apk
          path: zwei-herzen.apk
          retention-days: 14

      - name: Publish (newest APK for the website's download button)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Zwei Herzen for Android
          body: |
            Install: open this on your Android phone, tap zwei-herzen.apk, then Install
            (allow "Install unknown apps" for your browser or file manager once).
            Build ${{ github.run_number }} · the app updates its content by itself; this file only changes when the app shell does.
          files: zwei-herzen.apk
          make_latest: true
