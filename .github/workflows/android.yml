# Builds the Android app for Google Play. The whole app is built in (nothing loads from the
# website), so every change to the app makes a new build.
#  - Always: an .aab (for Google Play) and an .apk (for testing) as downloads on the run's page.
#  - On main, once the PLAY_SERVICE_ACCOUNT_JSON secret is set: uploaded to Google Play
#    (internal testing track) by itself.
name: Android app

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "supabase/**", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "supabase/**", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ZH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      ZH_VERSION_CODE: ${{ github.run_number }}
      # The same public Supabase settings the website is built with (Vercel → Environment Variables).
      EXPO_PUBLIC_RELAY_URL: ${{ secrets.RELAY_URL }}
      EXPO_PUBLIC_RELAY_KEY: ${{ secrets.RELAY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      - name: Supabase settings
        run: |
          if [ -z "$EXPO_PUBLIC_RELAY_URL" ] || [ -z "$EXPO_PUBLIC_RELAY_KEY" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then echo "::warning::RELAY_URL / RELAY_KEY secrets not set — test build without accounts."; exit 0; fi
            echo "::error::Add the RELAY_URL and RELAY_KEY secrets (the same values as Vercel's EXPO_PUBLIC_RELAY_URL / EXPO_PUBLIC_RELAY_KEY)."; exit 1
          fi

      - name: Build the app's screens
        run: npm run build
      - run: npx cap sync android

      - name: Firebase config (for notifications)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase: on"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — the app builds, but closed-app notifications won't work."
          fi

      - name: Signing key (the upload key for Google Play)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ZH_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zweiherzen.jks"
            echo "ZH_KEYSTORE_PATH=$RUNNER_TEMP/zweiherzen.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets not set — building a test (debug) app only."
          fi

      - name: Build
        working-directory: android
        run: |
          mkdir -p ../dist
          if [ "$SIGNED" = "1" ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
            cp app/build/outputs/bundle/release/app-release.aab ../dist/zwei-herzen.aab
            cp app/build/outputs/apk/release/app-release.apk ../dist/zwei-herzen.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/zwei-herzen-test.apk
          fi
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: zwei-herzen-android-${{ github.run_number }}
          path: dist/
          retention-days: 30

      - name: Upload to Google Play (internal testing)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNED == '1' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.zweiherzen.android
          releaseFiles: dist/zwei-herzen.aab
          track: internal
          status: completed
